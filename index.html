<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!--
  viewport-fit=cover        : iPhoneのノッチ／ホームバー領域まで背景を敷けるようにする
  maximum-scale / user-scalable=no : ネイティブアプリのようにピンチ拡大・
                                       ダブルタップ拡大を無効化し、
                                       カレンダーのダブルタップ操作と競合しないようにする
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>休日カレンダー</title>

<!-- ホーム画面追加時のアイコン（既存ファイルをそのまま利用） -->
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- PWA（ホーム画面に追加してアプリのように使う）関連メタタグ -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="休日カレンダー">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f7">

<!-- manifest はファイルを増やさず、JS側でBlobとして動的生成してリンクする（1ファイル運用のため） -->
<link rel="manifest" id="manifestLink">

<style>
/* ================================================================
   休日カレンダー / スタイル定義
   ・iOSの純正カレンダーアプリを参考にした、白ベース・角丸・控えめな影のデザイン
   ・画面全体にフィットさせ、スクロールなしで1ヶ月を表示することを最優先にしている
================================================================ */

/* ---- 色・サイズなどの基本トークン ---- */
:root{
  --color-bg:            #f2f2f7; /* 画面全体の背景（iOSのグループ背景相当） */
  --color-card:          #ffffff; /* カレンダー本体・モーダルの背景 */
  --color-border:        #e5e5ea; /* グリッド線・区切り線 */
  --color-text:          #1c1c1e; /* 通常の文字色 */
  --color-text-sub:       #8e8e93; /* 補助的な文字色（曜日見出し・情報バーなど） */
  --color-sunday:        #ff3b30; /* 日曜・祝日の文字色 */
  --color-saturday:      #007aff; /* 土曜の文字色 */
  --color-today:         #ff3b30; /* 今日の丸印 */
  --color-rest:          #34c759; /* 休日（休）のテーマカラー */
  --color-rest-bg:       #e6f9ea; /* 休日セルの背景 */
  --color-early:         #ff9500; /* 早番（早）のテーマカラー */
  --color-early-bg:      #fff3e0; /* 早番セルの背景 */
  --color-memo-time:     #007aff; /* メモの時間文字（青） */
  --color-memo-text:     #1c1c1e; /* メモの内容文字（黒） */
  --color-accent:        #ff9500; /* 編集モード中に画面を強調する色 */

  /* 画面の縦横小さい方(vmin)を基準に文字サイズを決める。
     こうすることで iPhone / iPad / PC のどの画面比率でも
     UI全体が破綻せず一定の比率で拡大縮小する。 */
  --base-font: clamp(21px, 3.3vmin, 28px);
}

/* ---- リセット ---- */
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{
  height:100%;
  overscroll-behavior:none;      /* iOSのバウンススクロールで背景が見えるのを防ぐ */
}
html{ font-size:var(--base-font); }
body{
  font-family:-apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Helvetica Neue", sans-serif;
  background:var(--color-bg);
  color:var(--color-text);
  overflow:hidden;               /* ページ自体はスクロールさせない（1ヶ月を必ず収める） */
  touch-action:manipulation;     /* ダブルタップでの拡大を抑止（メモ編集の誤動作防止） */
  -webkit-touch-callout:none;
}
button{ font-family:inherit; }

/* ================================================================
   全体レイアウト
   header（操作バー）→ calendar-card（可変・残り全部）→ footer（情報＋操作）
   の縦3段構成。calendar-card だけが flex:1 で余った高さを全部使う。
================================================================ */
.app{
  height:100vh;
  height:100dvh; /* 対応ブラウザではアドレスバーの増減に追従する高さを優先 */
  display:flex;
  flex-direction:column;
  padding:
    max(0.4rem, env(safe-area-inset-top))
    max(0.4rem, env(safe-area-inset-right))
    max(0.4rem, env(safe-area-inset-bottom))
    max(0.4rem, env(safe-area-inset-left));
  gap:0.4rem;
  max-width:1200px;   /* PCの広い画面では自動的に横幅が広がるが、際限なく伸びないように上限を設定 */
  width:100%;
  margin:0 auto;
}

/* ---- 上部操作バー（ロック/編集・月移動・今日・ヘルプ） ---- */
.header{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:0.35rem;
}
body.editing .header{ color:var(--color-accent); }

/* ロック／編集の切替（セグメントコントロール） */
.mode-segment{
  display:flex;
  background:var(--color-card);
  border-radius:0.7rem;
  padding:0.15rem;
  box-shadow:0 1px 2px rgba(0,0,0,0.06);
  flex:0 0 auto;
}
.mode-segment button{
  border:none;
  background:transparent;
  color:var(--color-text-sub);
  font-size:clamp(11px, 0.85rem, 14px);
  font-weight:600;
  padding:clamp(0.25rem, 0.35rem, 0.4rem) clamp(0.4rem, 0.55rem, 0.65rem);
  border-radius:0.55rem;
  cursor:pointer;
  line-height:1;
  white-space:nowrap;
}
.mode-segment button.active{ background:var(--color-rest-bg); color:var(--color-rest); }
.mode-segment button.active.is-edit{ background:var(--color-early-bg); color:var(--color-early); }

/* 月移動ナビゲーション */
.nav{
  flex:1 1 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0.3rem;
  min-width:0;
}
.nav-btn{
  flex:0 0 auto;
  width:clamp(28px, 1.9rem, 34px); height:clamp(28px, 1.9rem, 34px);
  border:none; border-radius:50%;
  background:var(--color-card);
  color:var(--color-rest);
  font-size:clamp(14px, 1.05rem, 18px);
  font-weight:700;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,0.06);
}
.month-title{
  font-size:clamp(13px, 1rem, 16px);
  font-weight:700;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:center;
  padding:0 0.2rem;
}
.month-title.current{ color:var(--color-today); }

/* 右側：今日ボタン・ヘルプボタン */
.header-right{ flex:0 0 auto; display:flex; align-items:center; gap:0.3rem; }
.today-btn{
  border:none; border-radius:0.7rem;
  background:var(--color-card);
  color:var(--color-rest);
  font-size:clamp(11px, 0.8rem, 13px); font-weight:700;
  padding:clamp(0.3rem, 0.4rem, 0.45rem) clamp(0.45rem, 0.6rem, 0.7rem);
  cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,0.06);
  white-space:nowrap;
}
.help-btn{
  width:clamp(28px, 1.9rem, 34px); height:clamp(28px, 1.9rem, 34px);
  border:none; border-radius:50%;
  background:var(--color-card);
  color:var(--color-text-sub);
  font-size:clamp(13px, 0.9rem, 16px); font-weight:700;
  cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,0.06);
}

/* 幅の狭いスマホでは月見出しが切れないよう、周りのボタンをさらに縮める */
@media (max-width: 420px){
  .mode-segment button{ font-size:13px; padding:0.28rem 0.4rem; }
  .today-btn{ font-size:13px; padding:0.32rem 0.5rem; }
  .nav-btn, .help-btn{ width:30px; height:30px; font-size:14px; }
  .month-title{ font-size:14px; padding:0 0.1rem; }
  .header{ gap:0.2rem; }
  .nav{ gap:0.15rem; }
  .header-right{ gap:0.2rem; }
}

/* ================================================================
   カレンダー本体
================================================================ */
.calendar-card{
  flex:1 1 auto;
  min-height:0;               /* Safariのflex縮小バグ対策（これが無いと縦にはみ出す） */
  display:flex;
  flex-direction:column;
  background:var(--color-card);
  border-radius:1rem;
  box-shadow:0 1px 4px rgba(0,0,0,0.08);
  overflow:hidden;
}

/* 曜日見出し行（高さ固定） */
.day-names{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(7, 1fr);
  border-bottom:1px solid var(--color-border);
}
.day-name{
  text-align:center;
  padding:0.3rem 0.1rem;
  font-size:0.72rem;
  font-weight:700;
  color:var(--color-text-sub);
}
.day-name.sun{ color:var(--color-sunday); }
.day-name.sat{ color:var(--color-saturday); }

/* 日付グリッド本体：残り高さをすべて使い、週数ぶんの行を"均等割り"にする。
   → grid-template-rows は render() 実行時にその月の週数に応じて
      JSから repeat(週数, 1fr) を指定する。min-height は一切使わない。
      これにより「1行目だけ縦長になる」不具合や、週によって高さが
      バラつく不具合を防いでいる。 */
.days-grid{
  flex:1 1 auto;
  min-height:0;                 /* 同じくSafariのflex縮小バグ対策 */
  display:grid;
  grid-template-columns:repeat(7, 1fr);
  gap:1px;
  background:var(--color-border); /* gapに背景色を敷いてグリッド線に見せる */
}

/* 日付1マス */
.day{
  background:var(--color-card);
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;                 /* 高さはgridの1frが決める。ここでmin-heightは指定しない */
  padding:0.12rem 0.2rem;
  overflow:hidden;
  cursor:pointer;
  user-select:none;
  position:relative;
}
.day.empty{ cursor:default; }
.day.sun{ background:#fff2f1; }
.day.sat{ background:#eef6ff; }
.day.holiday{ background:#fff2f1; }
/* 休み・早番は基本は白背景（.day のデフォルト）。
   ただし土日祝と重なった場合は、上の .day.sun / .day.sat / .day.holiday の
   背景色をそのまま優先させたいので、ここでは背景を上書きしない。 */
body.locked .day:not(.empty):active{ filter:none; }
body:not(.locked) .day:not(.empty):active{ filter:brightness(0.94); }

/* 日付セルの1行目：日付数字 + 休/早バッジ */
.day-top{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:0.15rem;
  min-width:0;
}
.day-num{
  font-size:clamp(12px, 0.85rem, 16px);
  font-weight:600;
  line-height:1.4;
  width:1.4em;
  height:1.4em;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  flex:0 0 auto;
}
.day.sun .day-num,
.day.holiday .day-num{ color:var(--color-sunday); }
.day.sat .day-num{ color:var(--color-saturday); }
.day.rest .day-num{ color:var(--color-rest); }
.day.early .day-num{ color:var(--color-early); }
/* 今日は丸い色つきバッジで強調（Appleカレンダー風） */
.day.today .day-num{
  background:var(--color-today);
  color:#fff !important;
  font-weight:700;
}

.day-badge{
  font-size:clamp(9px, 0.6rem, 11px);
  font-weight:700;
  color:#fff;
  border-radius:0.3rem;
  padding:0.05rem 0.25rem;
  line-height:1.5;
  flex:0 0 auto;
  white-space:nowrap;
}
.day-badge.rest{ background:var(--color-rest); }
.day-badge.early{ background:var(--color-early); }

/* メモ一覧 */
.memo-list{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:0.1rem;
  overflow:hidden;
  margin-top:0.1rem;
}
.memo-item{ line-height:1.1; overflow:hidden; }
.memo-time{
  font-size:clamp(10px, 0.72rem, 13px);
  font-weight:700;
  color:var(--color-memo-time);   /* 時間は青文字 */
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.memo-text{
  font-size:clamp(10px, 0.72rem, 13px);
  color:var(--color-memo-text);   /* 内容は黒文字 */
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.memo-more{
  font-size:0.65rem;
  color:var(--color-text-sub);
}

/* ================================================================
   モーダル共通（メモ編集・ヘルプ）
================================================================ */
.overlay{
  display:none;
  position:fixed; inset:0;
  background:rgba(0,0,0,0.4);
  align-items:center; justify-content:center;
  padding:1rem;
  z-index:100;
}
.overlay.show{ display:flex; }
.modal{
  background:var(--color-card);
  border-radius:1rem;
  width:100%; max-width:22rem;
  max-height:88vh;
  overflow-y:auto;
  padding:1.1rem 1.2rem;
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
}
.modal h2{
  font-size:0.95rem;
  text-align:center;
  margin-bottom:0.8rem;
  color:var(--color-text);
}
.modal-toggle-row{ display:flex; gap:0.6rem; margin-bottom:0.7rem; }
.modal-toggle{
  flex:1;
  display:flex; align-items:center; justify-content:center; gap:0.4rem;
  font-size:0.8rem; font-weight:600;
  padding:0.55rem 0.3rem;
  border-radius:0.6rem;
  border:1.5px solid var(--color-border);
  cursor:pointer;
  color:var(--color-text-sub);
}
.modal-toggle input{ width:1rem; height:1rem; accent-color:var(--color-rest); flex:0 0 auto; }
.modal-toggle.rest-toggle.checked{ border-color:var(--color-rest); background:var(--color-rest-bg); color:var(--color-rest); }
.modal-toggle.early-toggle input{ accent-color:var(--color-early); }
.modal-toggle.early-toggle.checked{ border-color:var(--color-early); background:var(--color-early-bg); color:var(--color-early); }

.memo-section-title{
  font-size:0.72rem; color:var(--color-text-sub); font-weight:700;
  margin-bottom:0.5rem; padding-bottom:0.3rem; border-bottom:1px solid var(--color-border);
}
.memo-entries{ display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.6rem; }
.memo-entry{
  display:flex; align-items:center; gap:0.4rem;
  background:#f7f7f9; border-radius:0.6rem; padding:0.4rem 0.5rem;
}
.memo-entry input[type="time"]{
  width:5.6rem; flex:0 0 auto;
  border:1px solid var(--color-border); border-radius:0.4rem;
  padding:0.3rem 0.35rem; font-size:0.78rem; font-family:inherit; outline:none;
}
.memo-entry input[type="text"]{
  flex:1; min-width:0;
  border:1px solid var(--color-border); border-radius:0.4rem;
  padding:0.3rem 0.5rem; font-size:0.78rem; font-family:inherit; outline:none;
}
.memo-entry input:focus{ border-color:var(--color-rest); }
.memo-del-btn{
  flex:0 0 auto; background:none; border:none; cursor:pointer;
  color:#c7c7cc; font-size:1.1rem; line-height:1; padding:0 0.15rem;
}
.memo-add-btn{
  width:100%; padding:0.5rem; border:1.5px dashed var(--color-border);
  border-radius:0.6rem; background:none; color:var(--color-text-sub);
  font-size:0.78rem; cursor:pointer; font-family:inherit;
}
.modal-btns{ display:flex; gap:0.6rem; margin-top:0.8rem; }
.modal-btns button{
  flex:1; padding:0.55rem; border:none; border-radius:0.6rem;
  font-size:0.8rem; font-weight:700; cursor:pointer; font-family:inherit;
}
.btn-save{ background:var(--color-rest); color:#fff; }
.btn-cancel{ background:#eeeef0; color:var(--color-text-sub); }
.btn-delete-entry{
  width:100%; margin-top:0.5rem; padding:0.45rem;
  border:none; border-radius:0.6rem; background:none;
  color:#c7c7cc; font-size:0.7rem; cursor:pointer; font-family:inherit;
}
.btn-delete-entry:active{ color:#ff3b30; }

.help-list{ display:flex; flex-direction:column; gap:0.6rem; margin-bottom:0.9rem; }
.help-row{ display:flex; align-items:center; gap:0.6rem; font-size:0.8rem; }
.help-icon{ flex:0 0 auto; font-size:1.1rem; width:1.6rem; text-align:center; }
</style>
</head>
<body class="locked">

<div class="app">

  <!-- ─────────────────────────────────────────
       ① 上部操作バー：ロック/編集切替・月移動・今日・ヘルプ
  ───────────────────────────────────────── -->
  <div class="header">
    <div class="mode-segment">
      <button id="lockModeBtn" class="active" title="ロックモード">🔒</button>
      <button id="editModeBtn" class="is-edit" title="編集モード">✏️</button>
    </div>

    <div class="nav">
      <button class="nav-btn" id="prevBtn" aria-label="前の月">‹</button>
      <div class="month-title" id="monthTitle"></div>
      <button class="nav-btn" id="nextBtn" aria-label="次の月">›</button>
    </div>

    <div class="header-right">
      <button class="today-btn" id="todayBtn">今日</button>
      <button class="help-btn" id="helpBtn" aria-label="使い方">?</button>
    </div>
  </div>

  <!-- ─────────────────────────────────────────
       ② カレンダー本体（残り高さをすべて使用）
  ───────────────────────────────────────── -->
  <div class="calendar-card">
    <div class="day-names" id="dayNames"></div>
    <div class="days-grid" id="daysGrid"></div>
  </div>

  <!-- ─────────────────────────────────────────
       ③ 下部バー：この月の集計・古い月の消去・リセット
  ───────────────────────────────────────── -->
</div>

<!-- ─────────────────────────────────────────
     メモ編集モーダル
───────────────────────────────────────── -->
<div class="overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle"></h2>

    <div class="modal-toggle-row">
      <label class="modal-toggle rest-toggle" id="restToggleLabel">
        <input type="checkbox" id="chkRest"> 休日
      </label>
      <label class="modal-toggle early-toggle" id="earlyToggleLabel">
        <input type="checkbox" id="chkEarly"> 早番
      </label>
    </div>

    <div class="memo-section-title">📝 メモ（時間と内容）</div>
    <div class="memo-entries" id="memoEntries"></div>
    <button class="memo-add-btn" id="addMemoBtn" type="button">＋ メモを追加</button>

    <div class="modal-btns">
      <button class="btn-cancel" id="modalCancelBtn" type="button">キャンセル</button>
      <button class="btn-save" id="modalSaveBtn" type="button">保存</button>
    </div>
    <button class="btn-delete-entry" id="modalDeleteBtn" type="button">この日の設定をすべて削除</button>
  </div>
</div>

<!-- ─────────────────────────────────────────
     使い方（ヘルプ）モーダル
───────────────────────────────────────── -->
<div class="overlay" id="helpOverlay">
  <div class="modal">
    <h2>使い方</h2>
    <div class="help-list">
      <div class="help-row"><span class="help-icon">👆</span>タップ：メモを編集（休日・早番もここで切替）</div>
      <div class="help-row"><span class="help-icon">↔️</span>左右にスワイプ：前月・翌月へ移動</div>
      <div class="help-row"><span class="help-icon">🔒/✏️</span>ロック中は誤タップ防止。編集するときだけ✏️に切替</div>
    </div>
    <div class="modal-btns">
      <button class="btn-save" id="helpCloseBtn" type="button">閉じる</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ================================================================
   休日カレンダー / アプリ本体スクリプト
   構成：
     1. PWA用マニフェストの動的生成
     2. 祝日データ（固定データ＋計算ロジック）
     3. 状態管理（グローバル変数）
     4. 日付ユーティリティ
     5. データの保存・読込（localStorage）
     6. カレンダー描画（render）
     7. 日付セルのタップ／ダブルタップ処理
     8. メモ編集モーダル
     9. 月移動・今日へ戻る・古い月の消去・月のリセット
    10. ロック／編集モードの切替
    11. スワイプ・トラックパッド・キーボード操作
    12. 初期化
================================================================ */


/* ================================================================
   1. PWA用マニフェストの動的生成
      1ファイル運用のため、manifest.jsonを別ファイルにせず
      JS側でBlobとして生成し <link rel="manifest"> に差し込む。
================================================================ */
(function setupManifest() {
  const manifest = {
    name: "休日カレンダー",
    short_name: "休日カレンダー",
    start_url: ".",
    display: "standalone",
    background_color: "#f2f2f7",
    theme_color: "#f2f2f7",

// 計算結果をキャッシュして、同じ年を何度も計算しないようにする
const calculatedHolidayCache = {};

/** その年の「第nthMonday(第n月曜日)」の日付(1〜31)を返す */
function findNthMonday(year, month, nth) {
  let count = 0;
  for (let day = 1; day <= 31; day++) {
    const date = new Date(year, month - 1, day);
    if (date.getMonth() !== month - 1) break; // 月をまたいだら終了
    if (date.getDay() === 1 && ++count === nth) return day;
  }
  return null;
}

/** 春分の日・秋分の日を近似式で計算する（国立天文台の計算式に基づく近似） */
function findEquinoxDay(year, type) {
  const base = type === "spring" ? 20.8431 : 23.2488;
  return Math.floor(base + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
}

/** 固定データが無い年について、祝日一覧を計算して { "YYYY-MM-DD": 名称 } の形で返す */
function calculateYearHolidays(year) {
  if (calculatedHolidayCache[year]) return calculatedHolidayCache[year];

  const result = {};
  const set = (month, day, name) => { result[formatDateKey(year, month, day)] = name; };

  set(1, 1, "元日");
  set(1, findNthMonday(year, 1, 2), "成人の日");
  set(2, 11, "建国記念の日");
  set(2, 23, "天皇誕生日");
  set(3, findEquinoxDay(year, "spring"), "春分の日");
  set(4, 29, "昭和の日");
  set(5, 3, "憲法記念日");
  set(5, 4, "みどりの日");
  set(5, 5, "こどもの日");
  set(7, findNthMonday(year, 7, 3), "海の日");
  set(8, 11, "山の日");
  set(9, findNthMonday(year, 9, 3), "敬老の日");
  set(9, findEquinoxDay(year, "autumn"), "秋分の日");
  set(10, findNthMonday(year, 10, 2), "スポーツの日");
  set(11, 3, "文化の日");
  set(11, 23, "勤労感謝の日");

  // 振替休日：祝日が日曜のとき、その直後の平日（まだ祝日でない日）を振替休日にする
  Object.keys(result).sort().forEach((key) => {
    const date = new Date(key + "T00:00:00");
    if (date.getDay() !== 0) return;
    const next = new Date(date);
    do {
      next.setDate(next.getDate() + 1);
    } while (result[formatDateKey(next.getFullYear(), next.getMonth() + 1, next.getDate())]);
    if (next.getFullYear() === year) {
      result[formatDateKey(year, next.getMonth() + 1, next.getDate())] = "振替休日";
    }
  });

  // 国民の休日：前後を祝日に挟まれた平日（9月に発生しうる）
  for (let day = 2; day <= 30; day++) {
    const prevKey = formatDateKey(year, 9, day - 1);
    const curKey  = formatDateKey(year, 9, day);
    const nextKey = formatDateKey(year, 9, day + 1);
    if (result[prevKey] && !result[curKey] && result[nextKey]) {
      result[curKey] = "国民の休日";
    }
  }

  calculatedHolidayCache[year] = result;
  return result;
}

/** 指定した日付キー("YYYY-MM-DD")の祝日名を返す。祝日でなければ空文字 */
function holidayName(dateKeyStr) {
  if (FIXED_HOLIDAYS[dateKeyStr]) return FIXED_HOLIDAYS[dateKeyStr];
  const year = Number(dateKeyStr.slice(0, 4));
  return calculateYearHolidays(year)[dateKeyStr] || "";
}


/* ================================================================

================================================================ */
const MONTH_NAMES = ["","1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const DAY_NAMES   = ["日","月","火","水","木","金","土"];
const MAX_MEMO_DISPLAY = 3; // セル内に表示するメモの最大件数（超えた分は「他◯件」）

const todayDate = new Date();

let currentYear  = todayDate.getFullYear();  // 現在表示中の年
let currentMonth = todayDate.getMonth() + 1; // 現在表示中の月（1〜12）
let editingDateKey = null;                   // メモ編集モーダルで編集中の日付キー
let isLocked = true;                         // true=ロックモード（誤タップ防止）／false=編集モード

/* カレンダーの本体データ。
   形式： { "YYYY-MM-DD": { rest: bool, early: bool, memos: [{time, text}, ...] } }
   ※ 既存のLocalStorageデータ（キー名 "calData"）とそのまま互換性を保つ */
let calendarData = loadJSON("calData", {});

/* 「これより前の月は消去済みで遡れない」という境界値 "YYYY-MM"（無ければnull）
   ※ 既存のLocalStorageキー名 "calEarliest" とそのまま互換性を保つ */



/* ================================================================
   4. 日付ユーティリティ
================================================================ */
function pad2(n) { return String(n).padStart(2, "0"); }

/** "YYYY-MM-DD" 形式の日付キーを作る */
function formatDateKey(year, month, day) {
  return `${year}-${pad2(month)}-${pad2(day)}`;
}

/** "YYYY-MM" 形式の月キーを作る */
function formatMonthKey(year, month) {
  return `${year}-${pad2(month)}`;
}

/** 指定した年月の日数を返す */
function daysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

/** 指定した年月の1日が何曜日か（0=日〜6=土）を返す */
function firstWeekdayOfMonth(year, month) {
  return new Date(year, month - 1, 1).getDay();
}

/** 指定した年月がカレンダー上で何週間ぶんになるかを返す（4〜6週） */
function weeksInMonth(year, month) {
  return Math.ceil((firstWeekdayOfMonth(year, month) + daysInMonth(year, month)) / 7);
}

function isSameDate(year, month, day, date) {
  return year === date.getFullYear() && month === date.getMonth() + 1 && day === date.getDate();
}


/* ================================================================
   5. データの保存・読込（localStorage）
================================================================ */
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (err) {
    // 壊れたデータが入っていた場合も、アプリ自体は必ず起動できるようにする
    console.error("読み込みに失敗しました:", key, err);
    return fallback;
  }
}

function saveCalendarData() {
  localStorage.setItem("calData", JSON.stringify(calendarData));
}


/** その日のデータを取得する（無ければ空オブジェクト） */
function getEntry(dateKeyStr) {
  return calendarData[dateKeyStr] || {};
}

/** その日のデータを保存する。休日でも早番でもメモも無ければキー自体を削除して掃除する */
function setEntry(dateKeyStr, entry) {
  const hasContent = entry.rest || entry.early || (entry.memos && entry.memos.length > 0);
  if (hasContent) {
    calendarData[dateKeyStr] = entry;
  } else {
    delete calendarData[dateKeyStr];
  }
  saveCalendarData();
}


/* ================================================================
   6. カレンダー描画
================================================================ */
function render() {
  renderHeader();
  renderDayNames();
  renderDaysGrid();
}

/** 上部バーの月タイトル表示を更新する */
function renderHeader() {
  const titleEl = document.getElementById("monthTitle");
  titleEl.textContent = `${currentYear}年${MONTH_NAMES[currentMonth]}`;
  const isCurrentMonth = isSameDate(currentYear, currentMonth, todayDate.getDate(), todayDate)
    || (currentYear === todayDate.getFullYear() && currentMonth === todayDate.getMonth() + 1);
  titleEl.classList.toggle("current", isCurrentMonth);
}

/** 曜日見出し行（日〜土）を描画する */
function renderDayNames() {
  const row = document.getElementById("dayNames");
  row.innerHTML = "";
  DAY_NAMES.forEach((name, i) => {
    const cell = document.createElement("div");
    cell.className = "day-name" + (i === 0 ? " sun" : i === 6 ? " sat" : "");
    cell.textContent = name;
    row.appendChild(cell);
  });
}

/** 日付グリッド本体を描画する。週数に応じて行の高さを均等割りにする */
function renderDaysGrid() {
  const grid = document.getElementById("daysGrid");
  grid.innerHTML = "";

  const numDays   = daysInMonth(currentYear, currentMonth);
  const firstWday = firstWeekdayOfMonth(currentYear, currentMonth);
  const numWeeks  = weeksInMonth(currentYear, currentMonth);

  // ここが「行の高さを全週そろえる」ための肝：
  // その月の週数ぶんだけ repeat(N, 1fr) を明示的に指定することで、
  // 4週の月・5週の月・6週の月のいずれでも、全ての行が同じ高さになり、
  // かつグリッド全体がちょうど親要素の高さ(残り画面全部)に収まる。
  grid.style.gridTemplateRows = `repeat(${numWeeks}, minmax(0, 1fr))`;

  // 月初より前の空白マス
  for (let i = 0; i < firstWday; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    grid.appendChild(empty);
  }

  // 実際の日付マス
  for (let day = 1; day <= numDays; day++) {
    grid.appendChild(createDayCell(day, firstWday));
  }

  // 月末より後の空白マス（最終週のマス数を7の倍数に揃える）
  const totalCells = firstWday + numDays;
  const trailingEmpty = (numWeeks * 7) - totalCells;
  for (let i = 0; i < trailingEmpty; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    grid.appendChild(empty);
  }
}

/** 1日ぶんの日付セルDOMを作る */
function createDayCell(day, firstWday) {
  const dateKeyStr = formatDateKey(currentYear, currentMonth, day);
  const entry = getEntry(dateKeyStr);
  const memos = entry.memos || [];
  const weekdayCol = (firstWday + day - 1) % 7; // 0=日, 6=土
  const isSunday = weekdayCol === 0;
  const isSaturday = weekdayCol === 6;
  const holidayLabel = holidayName(dateKeyStr);
  const isHoliday = !!holidayLabel;
  const isToday = isSameDate(currentYear, currentMonth, day, todayDate);

  const cell = document.createElement("div");
  cell.className = buildDayCellClassName(entry, isHoliday, isSunday, isSaturday, isToday);

  // 日付数字 + 休日/早番バッジ
  const top = document.createElement("div");
  top.className = "day-top";
  const numEl = document.createElement("span");
  numEl.className = "day-num";
  numEl.textContent = day;
  top.appendChild(numEl);
  if (entry.rest) {
    top.appendChild(createBadge("rest", "休"));
  } else if (entry.early) {
    top.appendChild(createBadge("early", "早"));
  }
  cell.appendChild(top);

  // メモ一覧（最大 MAX_MEMO_DISPLAY 件まで表示、残りは「他◯件」）
  if (memos.length > 0) {
    cell.appendChild(createMemoList(memos));
  }

  // メモも休日設定も無い祝日は、長押し/ホバーで祝日名がわかるようにtitle属性を付ける
  if (isHoliday && !entry.rest && memos.length === 0) {
    cell.title = holidayLabel;
  }

  attachDayCellTapHandler(cell, day);
  return cell;
}

function buildDayCellClassName(entry, isHoliday, isSunday, isSaturday, isToday) {
  let className = "day";
  if (isHoliday)         className += " holiday";
  else if (isSunday)     className += " sun";
  else if (isSaturday)   className += " sat";
  if (entry.rest)        className += " rest";
  else if (entry.early)  className += " early";
  if (isToday) className += " today";
  return className;
}

function createBadge(kind, label) {
  const badge = document.createElement("span");
  badge.className = "day-badge " + kind;
  badge.textContent = label;
  return badge;
}

function createMemoList(memos) {
  const list = document.createElement("div");
  list.className = "memo-list";

  memos.slice(0, MAX_MEMO_DISPLAY).forEach((memo) => {
    const item = document.createElement("div");
    item.className = "memo-item";
    if (memo.time) {
      const timeLine = document.createElement("div");
      timeLine.className = "memo-time";
      timeLine.textContent = memo.time;
      item.appendChild(timeLine);
    }
    const textLine = document.createElement("div");
    textLine.className = "memo-text";
    textLine.textContent = memo.text;
    item.appendChild(textLine);
    list.appendChild(item);
  });

  const hiddenCount = memos.length - MAX_MEMO_DISPLAY;
  if (hiddenCount > 0) {
    const more = document.createElement("div");
    more.className = "memo-more";
    more.textContent = `他 ${hiddenCount} 件`;
    list.appendChild(more);
  }
  return list;
}



/* ================================================================
   7. 日付セルのタップ処理
      タップ：メモ編集モーダルを開く（休日/早番はモーダル内のチェックボックスで切替）
      ※ 以前あったダブルタップ判定は廃止し、タップ後の反応を待たせない
================================================================ */
function attachDayCellTapHandler(cell, day) {
  cell.addEventListener("click", () => {
    if (isLocked) return; // ロック中は誤操作防止のため一切反応しない
    openMemoModal(currentYear, currentMonth, day);
  });
}



/* ================================================================
   8. メモ編集モーダル
================================================================ */
function openMemoModal(year, month, day) {
  editingDateKey = formatDateKey(year, month, day);
  const entry = getEntry(editingDateKey);
  const weekday = new Date(year, month - 1, day).getDay();
  const holidayLabel = holidayName(editingDateKey);

  document.getElementById("modalTitle").textContent =
    `${year}年${MONTH_NAMES[month]}${day}日（${DAY_NAMES[weekday]}）` + (holidayLabel ? `（${holidayLabel}）` : "");

  setModalToggleState("chkRest", "restToggleLabel", !!entry.rest);
  setModalToggleState("chkEarly", "earlyToggleLabel", !!entry.early);

  const container = document.getElementById("memoEntries");
  container.innerHTML = "";
  const memos = entry.memos || [];
  if (memos.length === 0) {
    addMemoRow(); // 何も無い場合は空の入力欄を1行だけ出しておく
  } else {
    memos.forEach((memo) => addMemoRow(memo.time, memo.text));
  }

  document.getElementById("modalOverlay").classList.add("show");
}

function closeMemoModal() {
  document.getElementById("modalOverlay").classList.remove("show");
  editingDateKey = null;
}

function setModalToggleState(inputId, labelId, checked) {
  const input = document.getElementById(inputId);
  const label = document.getElementById(labelId);
  input.checked = checked;
  label.classList.toggle("checked", checked);
}

/** メモ入力欄を1行追加する */
function addMemoRow(time = "", text = "") {
  const container = document.getElementById("memoEntries");
  const row = document.createElement("div");
  row.className = "memo-entry";

  const timeInput = document.createElement("input");
  timeInput.type = "time";
  timeInput.value = time;

  const textInput = document.createElement("input");
  textInput.type = "text";
  textInput.value = text;
  textInput.placeholder = "内容を入力…";
  textInput.maxLength = 20;

  const delBtn = document.createElement("button");
  delBtn.type = "button";
  delBtn.className = "memo-del-btn";
  delBtn.textContent = "×";
  delBtn.title = "この行を削除";
  delBtn.addEventListener("click", () => row.remove());

  row.appendChild(timeInput);
  row.appendChild(textInput);
  row.appendChild(delBtn);
  container.appendChild(row);
  textInput.focus();
}

/** モーダルの保存ボタン：チェック状態と入力済みメモを読み取って保存する */
function saveMemoModal() {
  if (!editingDateKey) return;

  const rest  = document.getElementById("chkRest").checked;
  const early = !rest && document.getElementById("chkEarly").checked; // 休日と早番は同時に成立しない

  const memos = [];
  document.querySelectorAll("#memoEntries .memo-entry").forEach((row) => {
    const time = row.querySelector('input[type="time"]').value.trim();
    const text = row.querySelector('input[type="text"]').value.trim();
    if (text) memos.push({ time, text }); // 内容が空の行は保存しない
  });

  setEntry(editingDateKey, { rest, early, memos });
  render();
  closeMemoModal();
}

/** 「この日の設定をすべて削除」ボタン */
function deleteMemoEntry() {
  if (!editingDateKey) return;
  if (!confirm("この日の休日設定とメモを消去します。\n本当に消去しますか？")) return;
  delete calendarData[editingDateKey];
  saveCalendarData();
  render();
  closeMemoModal();
}


/* ================================================================
   9. 月移動・今日へ戻る・古い月の消去・月のリセット
================================================================ */
function navigateMonth(direction) {
  let year = currentYear, month = currentMonth + direction;
  if (month > 12) { month = 1;  year++; }
  if (month < 1)  { month = 12; year--; }

  // 消去済みの境界より前の月には戻れない

  currentYear = year;
  currentMonth = month;
  render();
}

function goToCurrentMonth() {
  currentYear  = todayDate.getFullYear();
  currentMonth = todayDate.getMonth() + 1;
  render();
}

/** 「今月・先月」より古いデータをまとめて消去する（表示中の月ではなく実際の今日基準） */

/* ================================================================
   10. ロック／編集モードの切替
================================================================ */
function setLockedMode(locked) {
  isLocked = locked;
  document.body.classList.toggle("locked", locked);
  document.body.classList.toggle("editing", !locked);

  document.getElementById("lockModeBtn").classList.toggle("active", locked);
  document.getElementById("editModeBtn").classList.toggle("active", !locked);
}


/* ================================================================
   11. スワイプ・トラックパッド・キーボード操作
================================================================ */
function isAnyModalOpen() {
  return document.getElementById("modalOverlay").classList.contains("show")
      || document.getElementById("helpOverlay").classList.contains("show");
}

function setupSwipeNavigation() {
  const SWIPE_THRESHOLD_PX = 70;
  let startX = 0, startY = 0;

  document.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener("touchend", (e) => {
    if (isAnyModalOpen()) return; // モーダル表示中はスワイプで月が変わらないようにする
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > SWIPE_THRESHOLD_PX && Math.abs(dx) > Math.abs(dy)) {
      navigateMonth(dx < 0 ? 1 : -1);
    }
  }, { passive: true });
}

/** Macのトラックパッド等での横スクロール（deltaX）でも月を送れるようにする */
function setupTrackpadNavigation() {
  let wheelBusy = false;
  document.addEventListener("wheel", (e) => {
    if (wheelBusy || isAnyModalOpen() || Math.abs(e.deltaX) < 40) return;
    wheelBusy = true;
    navigateMonth(e.deltaX > 0 ? 1 : -1);
    setTimeout(() => { wheelBusy = false; }, 400);
  }, { passive: true });
}

function setupKeyboardShortcuts() {
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeMemoModal();
      document.getElementById("helpOverlay").classList.remove("show");
    }
  });
}


/* ================================================================
   12. 初期化：ボタンにイベントを割り当てて最初の描画を行う
================================================================ */
function initEventListeners() {
  document.getElementById("prevBtn").addEventListener("click", () => navigateMonth(-1));
  document.getElementById("nextBtn").addEventListener("click", () => navigateMonth(1));
  document.getElementById("todayBtn").addEventListener("click", goToCurrentMonth);

  document.getElementById("lockModeBtn").addEventListener("click", () => setLockedMode(true));
  document.getElementById("editModeBtn").addEventListener("click", () => setLockedMode(false));


  // メモ編集モーダル
  document.getElementById("addMemoBtn").addEventListener("click", () => addMemoRow());
  document.getElementById("modalSaveBtn").addEventListener("click", saveMemoModal);
  document.getElementById("modalCancelBtn").addEventListener("click", closeMemoModal);
  document.getElementById("modalDeleteBtn").addEventListener("click", deleteMemoEntry);
  document.getElementById("modalOverlay").addEventListener("click", (e) => {
    if (e.target.id === "modalOverlay") closeMemoModal(); // 背景タップで閉じる
  });
  document.getElementById("chkRest").addEventListener("change", (e) => {
    if (e.target.checked) setModalToggleState("chkEarly", "earlyToggleLabel", false);
    setModalToggleState("chkRest", "restToggleLabel", e.target.checked);
  });
  document.getElementById("chkEarly").addEventListener("change", (e) => {
    if (e.target.checked) setModalToggleState("chkRest", "restToggleLabel", false);
    setModalToggleState("chkEarly", "earlyToggleLabel", e.target.checked);
  });

  // ヘルプモーダル
  document.getElementById("helpBtn").addEventListener("click", () => {
    document.getElementById("helpOverlay").classList.add("show");
  });
  document.getElementById("helpCloseBtn").addEventListener("click", () => {
    document.getElementById("helpOverlay").classList.remove("show");
  });
  document.getElementById("helpOverlay").addEventListener("click", (e) => {
    if (e.target.id === "helpOverlay") e.currentTarget.classList.remove("show");
  });
}

function init() {
  initEventListeners();
  setupSwipeNavigation();
  setupTrackpadNavigation();
  setupKeyboardShortcuts();
  setLockedMode(true); // 起動時は常にロックモード（誤タップ防止）
  render();
}

init();
</script>
</body>
</html>
